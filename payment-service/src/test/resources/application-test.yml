spring:
  datasource:
    url: jdbc:h2:mem:payment_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
management:
  tracing:
    enabled: false
platform:
  integration-events:
    enabled: false
  payment:
    reconciliation-enabled: false
    webhook-secret: test-webhook-secret
  outbox:
    enabled: false
  security:
    jwt:
      issuer: urn:event-platform:auth
      audience: event-platform-api
      jwk-set-uri: http://localhost:0/jwks

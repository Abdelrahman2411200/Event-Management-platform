server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: auth-service-oauth2
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/oauth2/**,/login/oauth2/**
            - id: event-service
              uri: ${EVENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/events/**
            - id: venue-service
              uri: ${VENUE_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/venues/**
            - id: attendee-service
              uri: ${ATTENDEE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/attendees/**,/api/v1/bookings/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/payments/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/notifications/**

platform:
  metadata:
    api-version: v1
  gateway:
    security:
      allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:3000}
      jwt:
        issuer: ${JWT_ISSUER:urn:event-platform:auth}
        audience: ${JWT_AUDIENCE:event-platform-api}
        jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/api/v1/auth/.well-known/jwks.json}
      rate-limit:
        enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
        registration:
          replenish-rate: ${REGISTRATION_RATE_REPLENISH:1}
          burst-capacity: ${REGISTRATION_RATE_BURST:5}
        login:
          replenish-rate: ${LOGIN_RATE_REPLENISH:1}
          burst-capacity: ${LOGIN_RATE_BURST:10}
        refresh:
          replenish-rate: ${REFRESH_RATE_REPLENISH:1}
          burst-capacity: ${REFRESH_RATE_BURST:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis
        liveness:
          include: livenessState
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: ${spring.application.name}
    description: JWT-validating API gateway with explicit CORS, security headers, and Redis-backed authentication rate limits
    version: "@project.version@"
    api-version: v1

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"

spring:
  datasource:
    url: jdbc:h2:mem:notification_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  task:
    scheduling:
      enabled: false
management:
  tracing:
    enabled: false
platform:
  integration-events:
    enabled: false
  notification:
    reminder-lead: 24h
    delivery-max-attempts: 3
  security:
    jwt:
      issuer: urn:event-platform:auth
      audience: event-platform-api
      jwk-set-uri: http://localhost:0/jwks

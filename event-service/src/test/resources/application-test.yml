spring:
  datasource:
    url: jdbc:h2:mem:event_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  cache:
    type: none
  task:
    scheduling:
      enabled: false
platform:
  outbox:
    enabled: false
  inventory:
    expiry-enabled: false
management:
  health:
    redis:
      enabled: false
  tracing:
    enabled: false

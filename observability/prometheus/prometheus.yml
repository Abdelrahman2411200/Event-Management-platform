global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: platform-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - auth-service:8081
          - event-service:8082
          - venue-service:8083
          - attendee-service:8084
          - payment-service:8085
          - notification-service:8086

  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

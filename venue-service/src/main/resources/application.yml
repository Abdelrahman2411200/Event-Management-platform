server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: venue-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/venue_service}
    username: ${DATABASE_USERNAME:venue_service}
    password: ${DATABASE_PASSWORD:local_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
platform:
  security:
    jwt:
      issuer: ${JWT_ISSUER:urn:event-platform:auth}
      audience: ${JWT_AUDIENCE:event-platform-api}
      jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/api/v1/auth/.well-known/jwks.json}
  metadata:
    description: Venue, room, capacity, and availability management boundary
    version: ${APP_VERSION:@project.version@}
    api-version: v1
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
